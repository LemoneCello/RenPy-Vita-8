# Settings for one game, used by vita_pipeline.py (see README.md). Copy this
# file, adjust the paths, and run:
#
#   uv run RenPy-Vita-8/pipeline/vita_pipeline.py mygame.toml
#
# Paths are relative to the workspace (the current directory). Only use the
# pipeline on games you own, and never distribute the processed files.

[game]
title_id = "ABCD00001"            # app folder ux0:app/ABCD00001 (9 uppercase letters/digits)
# title = "My Game"               # default: config.name from the game's scripts
# art = "livearea.png"            # bubble icon and LiveArea pictures (default: the game's
                                  # loading screen, else its main menu art)
# Or one picture per place, each defaulting to art (scaled and centre-cropped to the size shown):
# art_icon = "icon.png"           # the bubble, 128x128
# art_background = "bg.png"       # the LiveArea background, 840x500
# art_start = "start.png"         # the picture on the LiveArea's start button, 280x158
dir = "MyGame-1.0-pc/game"        # the PC release's game/ directory
renpy = "MyGame-1.0-pc"           # the PC release (its Ren'Py runs vita_story.py)
# story_renpy = "OtherGame-pc"    # a Ren'Py 8 desktop build to run vita_story.py instead of
                                  # the game's own (a game made with Ren'Py 7 or older gets
                                  # the official SDK, downloaded once, without this)
# The loading screen: the game's presplash images, else these two (the
# foreground is revealed left to right as loading goes on), else the LiveArea
# background art (or the game's menu art) with a progress bar.
# presplash_background = "loading.png"
# presplash_foreground = "loading_full.png"
# screen_variants = "vita large pc"  # Ren'Py's layout variants; default "vita small phone touch
                                  # mobile" (the phone layout). For a game whose phone layout
                                  # doesn't fit its own GUI (text outside its text box...)
# base_extra = ["extras"]         # files or folders of the PC release to put next to game/
                                  # (ones the scripts name, like "../extras/x.txt", are found
                                  # by themselves)

[build]
# port_build = "build/port/vita"  # the eboot (vita_port_build.py's default output)
# root = "build/games"            # where outputs go

# --variant slice: a quick test build with only some folders, plus whatever
# the given scripts use.
[slice]
include = ["images/01/", "gui/"]
referenced_by = ["script.rpy"]

# Extra arguments per stage, e.g.
# [stages.video]
# args = ["--crf", "20.2"]
